<!doctype html>
<html>
  <head><meta charset="utf-8" /><title>Asset preview</title>
    <style>
      body { background:#14171f; color:#eee; font:13px system-ui; margin:0; padding:16px; }
      #grid { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
      figure { margin:0; background:#1d2230; border-radius:8px; padding:6px; }
      img { width:100%; display:block; border-radius:4px; background:#2a3040; }
      figcaption { font-size:11px; margin-top:5px; color:#c9d1e1; text-align:center; }
      #status { padding:8px 0; color:#e2c16e; }
    </style>
  </head>
  <body>
    <div id="status">loading…</div>
    <div id="grid"></div>
    <script type="module">
      import * as THREE from "three";
      import { GLTFLoader } from "three/examples/jsm/loaders/GLTFLoader.js";

      const MODELS = ["Sofa_01","ArmChair_01","CoffeeTable_01","ClassicConsole_01","Shelf_01",
        "WoodenTable_02","potted_plant_01","Chandelier_01","fancy_picture_frame_01",
        "book_encyclopedia_set_01","vintage_grandfather_clock_01"];

      const SIZE = 340;
      const renderer = new THREE.WebGLRenderer({ antialias:true, preserveDrawingBuffer:true });
      renderer.setSize(SIZE, SIZE);
      renderer.setPixelRatio(1);
      const camera = new THREE.PerspectiveCamera(35, 1, 0.01, 100);
      const loader = new GLTFLoader();
      const grid = document.getElementById("grid");
      const status = document.getElementById("status");

      for (const id of MODELS) {
        status.textContent = `rendering ${id}…`;
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x2a3040);
        scene.add(new THREE.HemisphereLight(0xffffff, 0x445566, 2.2));
        const key = new THREE.DirectionalLight(0xffffff, 2.4);
        key.position.set(3, 5, 4); scene.add(key);
        let caption = id;
        try {
          const gltf = await loader.loadAsync(`/models/${id}.glb`);
          const obj = gltf.scene;
          const box = new THREE.Box3().setFromObject(obj);
          const size = box.getSize(new THREE.Vector3());
          const center = box.getCenter(new THREE.Vector3());
          obj.position.sub(center);
          scene.add(obj);
          const radius = Math.max(size.x, size.y, size.z);
          camera.position.set(radius * 1.5, radius * 0.9, radius * 1.8);
          camera.lookAt(0, 0, 0);
          camera.updateProjectionMatrix();
          caption = `${id}\n${size.x.toFixed(2)} × ${size.y.toFixed(2)} × ${size.z.toFixed(2)} m`;
        } catch (e) {
          caption = `${id}\nFAILED: ${e.message}`;
        }
        renderer.render(scene, camera);
        const fig = document.createElement("figure");
        const img = document.createElement("img");
        img.src = renderer.domElement.toDataURL();
        const cap = document.createElement("figcaption");
        cap.textContent = caption;
        fig.append(img, cap);
        grid.append(fig);
      }
      status.textContent = "done";
    </script>
  </body>
</html>
