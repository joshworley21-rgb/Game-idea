name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Capacitor 8 requires Node >= 22; the CLI hard-fails on 20.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      # Caches the Gradle wrapper distribution (~200 MB) and the dependency
      # cache. Without this the wrapper re-downloads gradle-8.14.3-all.zip on
      # every run.
      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      # fetch-assets.mjs skips any file that already exists, so a warm cache
      # makes this a no-op. Cold, it pulls 11 props from Poly Haven plus the
      # OvalOffice release asset.
      - uses: actions/cache@v4
        with:
          path: assets-src
          key: polyhaven-${{ runner.os }}-${{ hashFiles('scripts/fetch-assets.mjs') }}
          restore-keys: |
            polyhaven-${{ runner.os }}-

      # FORCE_ASSETS re-downloads OvalOffice.glb even though a copy is
      # committed to the repo. Without it the committed file wins and a
      # rebuilt APK ships the old model. The Poly Haven props are unaffected:
      # they are cached in assets-src, which this does not touch.
      - name: Fetch assets
        timeout-minutes: 5
        env:
          FORCE_ASSETS: "1"
        run: npm run assets

      # The model is tens of MB. A size floor catches the case where the
      # download failed and the procedural fallback was bundled instead —
      # a non-empty check passes on a placeholder.
      - name: Verify the Oval Office model is bundled
        run: |
          set -euo pipefail
          f=public/models/OvalOffice.glb
          test -s "$f" || {
            echo "::error::$f is missing or empty"
            exit 1
          }
          size=$(stat -c%s "$f")
          echo "OvalOffice.glb: $((size / 1000000)) MB"
          if [ "$size" -lt 1000000 ]; then
            echo "::error::$f is only $((size / 1000)) KB — that is the procedural fallback, not the real model."
            exit 1
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npx vite build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Publishes to the rolling `latest` release, so there is one stable,
      # public, non-expiring download URL:
      #   https://github.com/joshworley21-rgb/Game-idea/releases/latest
      # The tag is moved to each new build rather than accumulating a release
      # per commit. `make_latest` keeps it the one the /latest redirect hits.
      - name: Publish APK to release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          body: |
            Debug-signed Android build of Oval, from commit ${{ github.sha }}.

            Sideload it: download the APK, allow installs from your browser or
            file manager when Android asks, and open it. Minimum Android 7.0
            (API 24). The game runs entirely on-device — no network call after
            install.

            **Debug-signed.** Fine for sideloading and for passing round; not
            fine for the Play Store, where a signature needs to mean something.
          files: android/app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
