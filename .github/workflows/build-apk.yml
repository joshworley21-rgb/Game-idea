name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Capacitor 8 requires Node >= 22; the CLI hard-fails on 20.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      # Caches the Gradle wrapper distribution (~200 MB) and the dependency
      # cache. Without this the wrapper re-downloads gradle-8.14.3-all.zip on
      # every run.
      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      # fetch-assets.mjs skips any file that already exists, so a warm cache
      # makes this a no-op. Cold, it pulls 11 props from Poly Haven plus the
      # OvalOffice release asset.
      - uses: actions/cache@v4
        with:
          path: assets-src
          key: polyhaven-${{ runner.os }}-${{ hashFiles('scripts/fetch-assets.mjs') }}
          restore-keys: |
            polyhaven-${{ runner.os }}-

      - name: Fetch assets
        timeout-minutes: 5
        run: npm run assets

      - name: Verify the Oval Office model is bundled
        run: |
          test -s public/models/OvalOffice.glb || {
            echo "::error::public/models/OvalOffice.glb is missing or empty"
            exit 1
          }
          ls -lh public/models/OvalOffice.glb

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npx vite build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
