name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Capacitor 8 requires Node >= 22; the CLI hard-fails on 20.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      # Caches the Gradle wrapper distribution (~200 MB) and the dependency
      # cache. Without this the wrapper re-downloads gradle-8.14.3-all.zip on
      # every run.
      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      # fetch-assets.mjs skips any file that already exists, so a warm cache
      # makes this a no-op. Cold, it pulls 11 props from Poly Haven plus the
      # OvalOffice release asset.
      - uses: actions/cache@v4
        with:
          path: assets-src
          key: polyhaven-${{ runner.os }}-${{ hashFiles('scripts/fetch-assets.mjs') }}
          restore-keys: |
            polyhaven-${{ runner.os }}-

      # FORCE_ASSETS re-downloads OvalOffice.glb even though a copy is
      # committed to the repo. Without it the committed file wins and a
      # rebuilt APK ships the old model. The Poly Haven props are unaffected:
      # they are cached in assets-src, which this does not touch.
      - name: Fetch assets
        timeout-minutes: 5
        env:
          FORCE_ASSETS: "1"
        run: npm run assets

      # The model is tens of MB. A size floor catches the case where the
      # download failed and the procedural fallback was bundled instead —
      # a non-empty check passes on a placeholder.
      - name: Verify the Oval Office model is bundled
        run: |
          set -euo pipefail
          f=public/models/OvalOffice.glb
          test -s "$f" || {
            echo "::error::$f is missing or empty"
            exit 1
          }
          size=$(stat -c%s "$f")
          echo "OvalOffice.glb: $((size / 1000000)) MB"
          if [ "$size" -lt 1000000 ]; then
            echo "::error::$f is only $((size / 1000)) KB — that is the procedural fallback, not the real model."
            exit 1
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npx vite build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      # A short, unique, human-readable build id. The short SHA is what the
      # release body and the APK filename both use, so the file on the phone
      # can be matched to a commit without opening anything.
      - name: Compute build id
        id: build
        run: echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Rename APK to include the build id
        run: |
          set -euo pipefail
          src=android/app/build/outputs/apk/debug/app-debug.apk
          dst="android/app/build/outputs/apk/debug/oval-${{ steps.build.outputs.short }}.apk"
          mv "$src" "$dst"
          echo "APK: $dst ($(( $(stat -c%s "$dst") / 1000000 )) MB)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: oval-${{ steps.build.outputs.short }}
          path: android/app/build/outputs/apk/debug/oval-${{ steps.build.outputs.short }}.apk
          if-no-files-found: error

      # One release per commit, tagged build-<short sha>, with the APK named
      # after the same commit. The rolling `latest` tag is still moved to the
      # newest build so /releases/latest keeps working, but it is no longer
      # the only way to get a build.
      #
      # Why per-commit releases: the old workflow reused the tag `latest` and
      # overwrote app-debug.apk in place. The download URL never changed, so
      # browsers and Android served the previously downloaded file from cache
      # and a new build was indistinguishable from the old one. A unique tag
      # and a unique filename make every build a distinct download.
      - name: Publish APK to a per-commit release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ steps.build.outputs.short }}
          name: Build ${{ steps.build.outputs.short }}
          body: |
            Debug-signed Android build of Oval, from commit ${{ github.sha }}.

            Sideload it: download the APK, allow installs from your browser or
            file manager when Android asks, and open it. Minimum Android 7.0
            (API 24). The game runs entirely on-device — no network call after
            install.

            **Debug-signed.** Fine for sideloading and for passing round; not
            fine for the Play Store, where a signature needs to mean something.
          files: android/app/build/outputs/apk/debug/oval-${{ steps.build.outputs.short }}.apk
          make_latest: true
