name: Process model

on:
  workflow_dispatch:
    inputs:
      simplify_error:
        description: "gltf-transform simplify error (meters)"
        required: false
        default: "0.003"
        type: string
  push:
    paths:
      - ".github/workflows/process-model.yml"

permissions:
  contents: write

concurrency:
  group: process-model
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download FBX
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release download v0.1-assets --pattern "OvalOffice_EmbededTextures.FBX" --output raw.fbx --clobber
          test -s raw.fbx || { echo "::error::raw.fbx empty"; exit 1; }
          ls -lh raw.fbx

      - name: Install FBX2glTF
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 5 -o fbx2gltf.zip "https://github.com/godotengine/FBX2glTF/releases/download/v0.13.1/FBX2glTF-linux-x86_64.zip"
          unzip -o fbx2gltf.zip
          bin=$(find . -maxdepth 3 -type f -name 'FBX2glTF*' ! -name '*.zip' | head -1)
          chmod +x "$bin"
          echo "FBX2GLTF=$PWD/$bin" >> "$GITHUB_ENV"

      - name: Convert to GLB
        run: |
          set -euo pipefail
          "$FBX2GLTF" --binary --input raw.fbx --output uncompressed.glb
          test -s uncompressed.glb || { echo "::error::no glb"; exit 1; }
          ls -lh uncompressed.glb

      - name: Optimise (quantize + webp + simplify)
        run: |
          set -euo pipefail
          npx --yes @gltf-transform/cli@4.5.0 optimize uncompressed.glb OvalOffice.glb --compress quantize --texture-compress webp --texture-size 1024 --simplify true --simplify-error "${{ inputs.simplify_error || '0.003' }}"
          test -s OvalOffice.glb || { echo "::error::no output"; exit 1; }
          ls -lh OvalOffice.glb

      - name: Verify no decoder needed
        run: |
          set -euo pipefail
          npm install --no-save @gltf-transform/core @gltf-transform/extensions meshoptimizer
          node --input-type=module -e '
          import { NodeIO } from "@gltf-transform/core";
          import { ALL_EXTENSIONS } from "@gltf-transform/extensions";
          import { MeshoptDecoder } from "meshoptimizer";
          const io = new NodeIO().registerExtensions(ALL_EXTENSIONS).registerDependencies({ "meshopt.decoder": MeshoptDecoder });
          const doc = await io.read("OvalOffice.glb");
          const root = doc.getRoot();
          const ext = root.listExtensionsUsed().map((e) => e.extensionName);
          console.log(`extensions: ${ext.join(", ") || "none"}`);
          const bad = ext.filter((n) => ["EXT_meshopt_compression","KHR_draco_mesh_compression","KHR_texture_basisu"].includes(n));
          if (bad.length) { console.error(`::error::uses ${bad.join(", ")} — needs a decoder`); process.exit(1); }
          if (root.listMeshes().length === 0) { console.error("::error::no meshes"); process.exit(1); }
          console.log(`meshes: ${root.listMeshes().length}`);
          '

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload v0.1-assets OvalOffice.glb --clobber
          gh release view v0.1-assets --json assets --jq '.assets[] | "  \(.name)  \(.size / 1000000 | floor) MB"'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: processed-model
          path: OvalOffice.glb
          if-no-files-found: error
