; Godot export presets.
;
; Written by hand rather than by the editor, because this repository is built
; in CI and there is no editor session to produce it. Every value here is a
; Godot 4.3 default except the ones commented below, which are the decisions.
;
; The Android preset does NOT use the Gradle build. Godot's prebuilt template
; APK is enough for this game — there are no Android plugins and no custom
; Java — and turning Gradle on would make the build need the full Android SDK
; and a working NDK toolchain in CI for no gain.

[preset.0]

name="Android"
platform="Android"
runnable=true
advanced_options=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
; node_modules and dist carry .gdignore so Godot never imports them, but the
; exporter walks the filesystem separately — these keep a 300 MB node_modules
; and a second copy of every model out of the APK.
exclude_filter="node_modules/*, dist/*, releases/*, docs/*, Unreal/*, android/*, src/*, scripts/*, assets-src/*, public/textures/*, public/audio/*, public/*.json, *.md, package*.json, tsconfig*.json, vite.config.*"
export_path="releases/Oval.apk"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
gradle_build/use_gradle_build=false
gradle_build/gradle_build_directory=""
gradle_build/android_source_template=""
gradle_build/compress_native_libraries=false
gradle_build/export_format=0
gradle_build/min_sdk=""
gradle_build/target_sdk=""
architectures/armeabi-v7a=false
; arm64 only. Every Android phone sold since 2017 is arm64, and shipping the
; 32-bit slice as well doubles the native payload for devices this game's
; renderer would not run on anyway.
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=false
version/code=1
version/name="0.1.0"
package/unique_name="com.oval.president"
package/name="Oval"
package/signed=true
package/app_category=2
package/retain_data_on_uninstall=false
package/exclude_from_recents=false
package/show_in_android_tv=false
package/show_in_app_library=true
package/show_as_launcher_app=false
launcher_icons/main_192x192=""
launcher_icons/adaptive_foreground_432x432=""
launcher_icons/adaptive_background_432x432=""
launcher_icons/adaptive_monochrome_432x432=""
graphics/opengl_debug=false
xr_features/xr_mode=0
screen/immersive_mode=true
; The game is a fixed-camera view of a room with an overlay on top of it, and
; it is read as much as it is played. Landscape only: a phone held upright
; would put the country panel over the lectern.
screen/support_small=true
screen/support_normal=true
screen/support_large=true
screen/support_xlarge=true
user_data_backup/allow=false
command_line/extra_args=""
apk_expansion/enable=false
apk_expansion/SALT=""
apk_expansion/public_key=""
permissions/custom_permissions=PackedStringArray()
permissions/access_checkin_properties=false
permissions/internet=false

; A desktop build, which is how the game gets looked at during development:
; the Android APK takes a phone and a cable to see, and a Linux binary runs
; under xvfb in the same session that wrote the code.
[preset.1]

name="Linux"
platform="Linux"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="node_modules/*, dist/*, releases/*, docs/*, Unreal/*, android/*, src/*, scripts/*"
export_path="releases/oval.x86_64"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.1.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=0
binary_format/embed_pck=false
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"
